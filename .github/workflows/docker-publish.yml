name: docker-publish

# 打 tag 时构建并推送镜像到 GitHub Container Registry；
# 推到 main / PR 时只构建不推送，用来提前发现构建失败。
#
# 推送目标：ghcr.io/<owner>/<repo>，例如 ghcr.io/lmgateways/iotserver-mqtt-driver
#
# 用仓库内置的 GITHUB_TOKEN 认证，不需要额外配置任何 secret。

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      # 只有打 tag 时才登录并推送；main/PR 走匿名构建
      - name: 登录 ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            # v1.0.0 → 1.0.0 / 1.0 / latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # main 分支 → main
            type=ref,event=branch
            # PR → pr-<编号>
            type=ref,event=pr

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # 仅打 tag 时推送，其它情况只验证能否构建
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CI 在 GitHub 网络上，用官方代理比 goproxy.cn 快
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出摘要
        run: |
          echo "### 镜像构建完成 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "已推送到：" >> $GITHUB_STEP_SUMMARY
          else
            echo "仅验证构建（非 tag，未推送）。打 tag 后会自动推送：" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY